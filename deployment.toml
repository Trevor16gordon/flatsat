# DEPLOYMENT — how this vehicle's processes run on a flight computer.
#
# Separate from the vehicle composition on purpose: the same spacecraft
# definition can be deployed to different computers with different
# real-time budgets. Core ROLES here are mapped to physical cores by the
# host profile (tools/host-profiles/*.env), so nothing in this file is
# board-specific either.
#
# tools/gen-units.py joins vehicle + deployment + host profile into systemd
# units. A sensor added to the vehicle file needs no entry here — it
# inherits [sensor_defaults].

[sensor_defaults]
memory_max = "256M"
# no core_role: housekeeping CPUs, keeping the RT core clean

[actuator_defaults]
memory_max = "256M"
# no core_role: the daemon's own cadence is not hard-RT; the stale-zero
# protection makes lateness degrade to the quiet state, not to a hazard

# Per-actuator overrides go in [actuators.<name>], same shape as sensors.

[control]
rt_policy = "fifo"
rt_priority = 80
core_role = "rt_core"
memory_max = "512M"

# Per-sensor overrides go in [sensors.<name>], e.g. a hard-real-time IMU:
# [sensors.imu0]
# rt_policy = "fifo"
# rt_priority = 70

[recorder]
memory_max = "256M"
# no core_role: archive writing is housekeeping, keeping the RT core clean

[mode_manager]
memory_max = "128M"
# no core_role, dependency-minimal: Safe's entry path must not depend on
# anything that can be the reason for entering it
