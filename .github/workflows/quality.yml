# CI quality gate — same hooks as local pre-commit, so a locally bypassed
# commit (--no-verify) still fails here. Keep this and .pre-commit-config.yaml
# as the single source of truth for what "clean" means.
name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # match onboard Python
      - uses: pre-commit/action@v3.0.1

  proto-drift:
    # Generated bindings are committed; regenerating them must be a no-op.
    # This is what makes "edit the .proto, commit" the whole workflow — a
    # stale binding cannot land.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install proto toolchain
        run: pip install grpcio-tools mypy-protobuf
      - name: Regenerate bindings
        run: FLATSAT_ML_VENV="$(dirname "$(dirname "$(which python)")")" ./tools/gen-protos.sh
      - name: Fail on drift
        run: git diff --exit-code -- '*_pb2.py' '*_pb2.pyi'

  traceability:
    # Requirements must stay linked to their verification. Fails on an
    # unverified test-verified requirement or a test citing an unknown ID.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test deps
        run: pip install pytest tomli protobuf numpy eclipse-zenoh
      - name: Check requirements traceability
        run: python tools/traceability.py --strict
