# VEHICLE COMPOSITION — what this spacecraft IS.
#
# Sensors are named driver instances; control is a named strategy plus a
# named objective. Everything here is looked up by name in
# flatsat/core/registry.py, so a different spacecraft is a different file of this
# shape — not different code:
#
#   * more/fewer sensors   -> add or remove [[sensors]] entries
#   * simulated vs real    -> change `driver` (basilisk_imu -> imu_bno055, ...)
#   * PD vs PID vs ML      -> change `strategy` and its options
#   * detumble vs pointing -> change `objective` and its options
#
# Deployment concerns (RT priority, core, memory budget) live in
# deployment.toml; board topology lives in tools/host-profiles/.
# Those are separate on purpose: the same vehicle can be deployed to
# different flight computers.

name = "flatsat-v1"
description = "Flat-sat: Basilisk-fed IMU + wheel, Jetson housekeeping, PD detumble"

# Physical model — integration truth, read by flight software AND by the
# sim bridge to build its plant, so the two cannot disagree by accident.
[body]
mass_kg = 10.0
inertia_kg_m2 = [[0.9, 0.0, 0.0], [0.0, 0.8, 0.0], [0.0, 0.0, 0.6]]

# ONE vehicle file serves bench and HIL — only the Mac's presence differs.
# With no bridge running this is the correct quiet state: imu0 publishes
# STALE-flagged samples on cadence, commands self-flag, the wheel zeroes.
[[sensors]]
name = "imu0"
driver = "basilisk_imu"      # swap for a hardware driver; nothing else changes
topic = "hal/imu0/sample"
rate_hz = 100.0
spec = "config/devices/imu0.toml"  # device characteristics, shared corruption model
truth_topic = "sim/truth/state"    # where the bridge publishes physics truth
stale_after_s = 0.5

[[sensors]]
name = "thermal_tj"
driver = "jetson_thermal"
topic = "hal/thermal_tj/sample"
rate_hz = 1.0
zone = "tj-thermal"

[[actuators]]
name = "wheel0"
driver = "basilisk_reaction_wheel"     # sim_reaction_wheel = local-only alternative
command_topic = "adcs/wheel_torque"    # body-frame torque from the control loop
state_topic = "hal/wheel0/state"
rate_hz = 100.0
stale_zero_s = 0.1                     # zero the wheel when commands stop
device = "config/devices/wheel0.toml"  # device-intrinsic envelopes

[actuators.mounting]                   # integration truth: where it points
position_m = [0.0, 0.0, 0.0]
axis = [1.0, 0.0, 0.0]                 # spin axis in the body frame

[control]
strategy = "rate_damping"    # registry key; "pid" is the other one today
objective = "constant_rate"  # guidance source producing the reference
rate_hz = 100.0
input_topic = "hal/imu0/sample"
output_topic = "adcs/wheel_torque"
stale_after_s = 0.05
kp = 0.02                    # strategy-specific options follow
kd = 0.005
max_torque_n_m = 0.05        # reaction-wheel envelope; commands clip to it

[control.objective_options]
target_rates_rad_s = [0.0, 0.0, 0.0]   # zero = detumble
