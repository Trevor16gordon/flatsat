# MISSION PROFILE — a mission is data, not code.
#
# The scenario runner (flatsat/sim/scenario.py) composes the vehicle's
# real daemons, control loop, and mode manager against a local plant,
# executes these phases in order, and judges each phase's success
# criteria. A different mission is a different file of this shape.

name = "detumble-test"
description = "3-axis tumble brought to rest by the composed flight chain"
vehicle = "config/vehicles/test_scenario.toml"

[initial]
omega0_rad_s = [0.4, -0.3, 0.2]
plant_rate_hz = 100.0

[[phases]]
name = "detumble"
duration_s = 8.0

[phases.success]
max_omega_mag_rad_s = 0.02    # converged well below the initial tumble
require_mode = "NOMINAL"      # clean boot keeps the system nominal
require_all_acks = true       # every registered app heard the mode
