# Reaction-wheel device specification — DEVICE-INTRINSIC truth.
#
# True of this unit no matter which spacecraft it is bolted to: the
# datasheet envelopes the flight-side driver enforces and the simulation
# respects. Where the wheel POINTS is integration truth and lives in the
# vehicle file's mounting entry, never here.
#
# Values are placeholder/representative (a smallsat wheel class part)
# until a physical wheel is on the bench. Calibration keys (measured
# alignment, friction, torque scale) land here when a characterization
# campaign first produces them — discovered knowledge updates this file,
# never the design.

name = "wheel0"

max_torque_n_m = 0.05        # torque envelope; commands clip (and flag) beyond
max_momentum_n_m_s = 0.5     # momentum storage; SATURATED at the rail
rotor_inertia_kg_m2 = 8.3e-4 # speed = momentum / inertia (~600 rad/s at the rail)
