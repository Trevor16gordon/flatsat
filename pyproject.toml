# flatsat: packaging + repo-wide Python quality configuration.
#
# The `flatsat/` package is the Tier-1 versionable artifact — everything
# that ships to a flight computer, tests included (an installed release can
# self-test on target). Deployment today is a git checkout run via -m; the
# [project] table is what makes the same tree build as one artifact.
#
# Enforcement contract (see .pre-commit-config.yaml + CI):
#   - Every function/method MUST have type annotations on all inputs and the
#     return value (ruff ANN* + mypy disallow_untyped_defs — two independent
#     enforcers).
#   - Every module, class, and function MUST have a docstring (ruff D*,
#     Google convention).
# Commits that violate these fail at the pre-commit hook; pushes fail in CI.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flatsat"
version = "0.1.0"
description = "Flat-sat flight software: bus-composed daemons, ADCS, HIL bridge"
requires-python = ">=3.10"
dependencies = [
    "eclipse-zenoh",
    "protobuf",
    "numpy",
    "tomli; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["flatsat*"]

[tool.setuptools.package-data]
# Stubs ship everywhere (typed config access on target); protos ship as
# the human-readable schema reference beside their bindings.
"*" = ["*.pyi", "*.proto"]

[tool.pytest.ini_options]
# Tests colocate: one <name>_test.py beside every module, shipped in the
# package. Tests must use test-only topic names — a test subscribing to a
# production key silently reads a live daemon's (or a running HIL sim's)
# traffic.
testpaths = ["flatsat"]
python_files = ["*_test.py"]
markers = [
    "verifies(*requirement_ids): this test verifies the given requirement IDs (see requirements/ and tools/traceability.py)",
]

[tool.ruff]
line-length = 100
target-version = "py310"          # onboard Python is 3.10 (fixed by Ubuntu 22.04)
# Generated protobuf bindings are exempt from the quality contract — the
# .proto files are the reviewed source of truth (see tools/gen-protos.sh).
# force-exclude makes the exemption hold even when pre-commit passes the
# generated filenames explicitly.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import ordering)
    "UP",       # pyupgrade
    "B",        # bugbear (likely bugs)
    "ANN",      # flake8-annotations: EVERY function input + return typed
    "D",        # pydocstyle: EVERY module/class/function has a docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests may skip docstrings-on-every-test verbosity, but not type annotations.
"**/*_test.py" = ["D100", "D103"]

[tool.mypy]
python_version = "3.10"
# The hard gate: untyped or partially-typed defs are errors.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
# gnuradio/iio/jetson libs ship no type stubs; don't block on them.
ignore_missing_imports = true
