# Comms: the managed pipe to the ground.
#
# The space link is intermittent, asymmetric, high-BER, and mostly
# absent (PLAN §6). These requirements are about surviving that channel
# honestly — and about the layering that lets a learned receiver replace
# the classical PHY under IDENTICAL framing, which is what makes the
# eventual comparison meaningful.

[[requirement]]
id = "FSW-LINK-001"
statement = """
The framing layer shall delimit payloads such that a payload handed to
the transmitter is recovered byte-identically by the receiver.
"""
rationale = "The floor everything above the channel stands on."
verification = "test"
evidence = "ccsds_test.py::test_round_trip and ::test_frame_split_across_reads"
status = "verified"

[[requirement]]
id = "FSW-LINK-002"
statement = """
A corrupted frame shall be dropped and counted, never delivered; the
deframer shall resynchronize and continue delivering subsequent frames.
"""
rationale = """
Silence about corruption would let the link fabricate telemetry —
strictly worse than losing it. And one bad frame must not poison the
stream behind it, or a single bit error costs an entire pass.
"""
verification = "test"
evidence = "ccsds_test.py::test_corrupted_frame_is_dropped_and_counted, ::test_good_frame_after_corrupted_one_still_arrives, ::test_leading_garbage_resynchronizes; link_test.py::test_bit_errors_cost_frames_not_correctness"
status = "verified"

[[requirement]]
id = "FSW-LINK-003"
statement = """
The link shall segment messages larger than one frame and deliver them
only once every segment has arrived; the topics carried shall be an
explicit allowlist, never the whole bus.
"""
rationale = """
Segmentation is what makes file uplink possible and bounds the cost of
a corrupted frame to one segment. Half a model is not a model, so
partial messages are withheld. The allowlist is PLAN §6's two-bus rule:
middleware is never tunneled over the space link.
"""
verification = "test"
evidence = "link_test.py::test_large_message_is_segmented_and_reassembled, ::test_partial_message_is_never_delivered; link_service_test.py::test_only_allowlisted_topics_are_carried"
status = "verified"

[[requirement]]
id = "FSW-LINK-004"
statement = """
Outside a contact window the link shall queue messages rather than
transmit, and shall drain the queue when a window opens; the queue shall
be bounded.
"""
rationale = """
Simulated pass geometry is what makes this a spacecraft link rather than
a network socket — telemetry accumulates between passes and dumps on
contact. Bounded memory beats an out-of-memory kill in orbit.
"""
verification = "test"
evidence = "link_test.py::test_store_and_forward_holds_traffic_until_contact, ::test_contact_schedule_windows, ::test_queue_is_bounded"
status = "verified"

[[requirement]]
id = "FSW-LINK-005"
statement = """
A modem capable of radiating shall refuse to transmit unless its
configuration carries an explicit transmit acknowledgement, shall report
the refusal as a validity flag, and shall state the gate's status in its
startup description.
"""
rationale = """
The bench convention (FSW-RADIO-001) becomes structural in flight code:
an accidentally-deployed configuration cannot radiate. Receiving needs
no gate — listening radiates nothing.
"""
verification = "test"
evidence = "pluto_gmsk_test.py::test_transmit_refused_without_acknowledgement and ::test_refusal_is_visible_in_describe"
status = "verified"

[[requirement]]
id = "FSW-LINK-006"
statement = """
A bus message published on one segment's allowlisted topic shall be
republished on the other segment's bus after crossing the link.
"""
rationale = "End to end, the link is invisible to every other process."
verification = "test"
evidence = "link_service_test.py::test_telemetry_crosses_the_link_and_is_republished"
status = "verified"

[[requirement]]
id = "FSW-LINK-007"
statement = """
With the link down, onboard processes shall continue operating
unaffected; only ground data shall become stale.
"""
rationale = """
PLAN §6's correctness test, stated as a requirement: a spacecraft that
depends on its ground link to keep flying is not a spacecraft.
"""
verification = "test"
evidence = "link_service_test.py::test_the_spacecraft_keeps_working_with_the_link_dead"
status = "verified"

[[requirement]]
id = "FSW-LINK-008"
statement = """
The GMSK physical layer shall transmit without gaps — idle time filled
with idle symbols, queued frames taking precedence over fill — and on
receive shall recover byte alignment at any bit phase by hunting the
attached sync marker, tolerating a single bit error in the marker and
delivering each framed block exactly once regardless of how reads
segment the stream.
"""
rationale = """
A silent transmit gap costs the demodulator its clock lock — the
regression that produced 100 frames sent and 0 recovered on 2026-07-29.
GMSK hands the receiver bits at an arbitrary phase, so byte alignment
is a property the marker hunt must restore, not assume.
"""
verification = "test"
evidence = "pluto_gmsk_test.py::test_idle_fill_keeps_the_modulator_running, ::test_queued_frames_take_precedence_over_idle, ::test_byte_alignment_is_recovered_at_any_bit_phase, ::test_sync_tolerates_a_bit_error_in_the_marker, ::test_frame_straddling_two_reads_is_not_lost, ::test_each_frame_is_delivered_exactly_once, ::test_each_marker_starts_its_own_block_at_its_own_phase"
status = "verified"

[[requirement]]
id = "FSW-LINK-009"
statement = """
Frames shall be randomized with the CCSDS 131.0-B sequence before
transmission, so that constant and repeating payloads still present the
bit-transition density symbol clock recovery needs.
"""
rationale = """
The sequence is pinned to the bits the standard prints, because a
randomizer that is self-consistent but non-standard interoperates with
nothing. Transition density is the property the randomizer exists for,
so it is measured rather than assumed.
"""
verification = "test"
evidence = "randomizer_test.py::test_sequence_matches_the_published_standard, ::test_randomizing_breaks_up_a_constant_payload, ::test_randomizing_helps_all_the_pathological_patterns"
status = "verified"

[[requirement]]
id = "FSW-LINK-010"
statement = """
Link frames shall carry Reed-Solomon (255,223) parity; the decoder
shall correct up to 16 corrupted bytes per codeword — bursts and
damage to the parity region included — and shall refuse, rather than
miscorrect, codewords beyond its correction power.
"""
rationale = """
A decoder that miscorrects is worse than no decoder: it hands
plausible wrong bytes upward with the checksum recomputed over them.
Refusal beyond t is therefore tested as thoroughly as correction
within it, including that pure noise is almost never accepted.
"""
verification = "test"
evidence = "reed_solomon_test.py::test_corrects_up_to_sixteen_corrupted_bytes, ::test_single_bit_errors_are_corrected, ::test_corrects_a_burst_that_would_ruin_a_bit_oriented_code, ::test_corrects_errors_landing_in_the_parity_itself, ::test_refuses_beyond_its_correction_power, ::test_pure_noise_is_almost_never_accepted_as_a_codeword"
status = "verified"

[[requirement]]
id = "FSW-LINK-011"
statement = """
The serial seam between the link service and the modem shall conform
to the KISS protocol byte for byte — FEND delimiting, FESC/TFEND/TFESC
escaping — and the decoder shall reassemble frames regardless of how
the transport splits or batches the byte stream.
"""
rationale = """
Conformance is checked against hand-written byte sequences, not only
our own encoder: an encoder and decoder that share a mistake agree
with each other forever and with nobody else. A real socket delivers
bytes split anywhere, so reassembly is exercised across a live socket
too.
"""
verification = "test"
evidence = "kiss_test.py::test_encoding_matches_the_kiss_spec_byte_for_byte, ::test_delimiter_inside_the_payload_is_escaped, ::test_escape_character_inside_the_payload_is_escaped, ::test_a_frame_split_across_reads_is_reassembled, ::test_frames_cross_a_real_socket"
status = "verified"
