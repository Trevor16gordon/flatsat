// Per-driver configuration options — one message per registered driver.
//
// The vehicle file selects a driver by filling exactly one of these
// inside a SensorConfig/ActuatorConfig oneof (vehicle.proto); the oneof
// field name IS the registry key, so the selector and its options can
// never disagree. A new driver adds its message here and a oneof entry
// there — the loaders never change.
//
// `optional` marks numeric fields whose absence must be distinguishable
// from zero (a default applies when absent; zero is a real value).

syntax = "proto3";

package flatsat.v1;

// jetson_thermal: one kernel thermal zone as a temperature sensor.
message JetsonThermalOptions {
  string zone = 1;  // kernel zone type name, e.g. "tj-thermal" (required)
}

// basilisk_imu: the sim bridge's truth stream through the device model.
message BasiliskImuOptions {
  string spec = 1;                    // device file; empty = config/devices/imu0.txtpb
  string truth_topic = 2;             // empty = sim/truth/state
  optional double stale_after_s = 3;  // absent = 0.5
  optional int64 seed = 4;            // corruption RNG seed; absent = unseeded
}

// sim_reaction_wheel: local wheel fake, no physics feedback.
message SimReactionWheelOptions {
  string device = 1;  // wheel device file, e.g. config/devices/wheel0.txtpb (required)
}

// basilisk_reaction_wheel: wheel fake whose applied torque feeds the sim.
message BasiliskReactionWheelOptions {
  string device = 1;  // wheel device file (required)
}

// basilisk_magnetometer: the truth stream's body-frame field through the
// device model.
message BasiliskMagnetometerOptions {
  string spec = 1;                    // device file; empty = config/devices/mag0.txtpb
  string truth_topic = 2;             // empty = sim/truth/state
  optional double stale_after_s = 3;  // absent = 0.5
  optional int64 seed = 4;            // corruption RNG seed; absent = unseeded
}

// basilisk_sun_sensor: the truth stream's body-frame sun vector through
// the device model.
message BasiliskSunSensorOptions {
  string spec = 1;                    // device file; empty = config/devices/css0.txtpb
  string truth_topic = 2;             // empty = sim/truth/state
  optional double stale_after_s = 3;  // absent = 0.5
  optional int64 seed = 4;            // corruption RNG seed; absent = unseeded
}

// basilisk_magnetorquer: rod fake whose applied dipole feeds the sim.
message BasiliskMagnetorquerOptions {
  string device = 1;  // magnetorquer device file (required)
}

// Star tracker fed by plant truth: true attitude through the device
// model (noise + exclusion blinding). Same shape as the other
// basilisk_* sensor options.
message BasiliskStarTrackerOptions {
  string spec = 1;                   // device file; empty = config/devices/st0.txtpb
  string truth_topic = 2;            // empty = sim/truth/state
  optional double stale_after_s = 3; // truth age beyond which reads are STALE
  optional uint32 seed = 4;          // deterministic corruption for tests
}
