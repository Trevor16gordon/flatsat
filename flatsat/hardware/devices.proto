// Device-intrinsic truth — the datasheet a config/devices/*.txtpb file
// fills out. True of the unit no matter which spacecraft it is bolted
// to; where a device POINTS is integration truth (vehicle.proto
// MountingConfig), never here.
//
// Calibration fields (measured scale factors, biases, alignment) land
// here when a characterization campaign first produces them —
// discovered knowledge updates the data file, never the design.

syntax = "proto3";

package flatsat.v1;

// IMU: limits, resolution, and noise character. Read by BOTH the
// flight-side driver (to know the device) and the simulation's sensor
// model (to corrupt truth the way the device would).
message ImuDevice {
  string name = 1;                    // instance name (becomes the message source)
  double rate_hz = 2;                 // native output data rate
  double gyro_noise_rad_s = 3;        // white-noise sigma per gyro axis
  double gyro_full_scale_rad_s = 4;   // measurement limit; beyond it the device rails
  double gyro_lsb_rad_s = 5;          // quantization step of the gyro output
  double accel_noise_m_s2 = 6;        // white-noise sigma per accelerometer axis
  double accel_full_scale_m_s2 = 7;   // accelerometer measurement limit
  double temperature_c = 8;           // nominal reported die temperature (also the initial value)
  // Orbital thermal response — MODELED, not measured: the die relaxes
  // first-order toward a sunlit or eclipse equilibrium as the vehicle
  // crosses the terminator. Zero time constant = static temperature_c
  // (the pre-thermal behavior, and the right choice for a bench part
  // that never sees space).
  double temperature_sunlit_c = 9;    // equilibrium in sunlight
  double temperature_eclipse_c = 10;  // equilibrium in shadow
  double thermal_time_constant_s = 11;  // first-order lag; 0 disables the model
}

// Reaction wheel: torque and momentum envelopes.
message WheelDevice {
  string name = 1;                    // instance name (becomes the message source)
  double max_torque_n_m = 2;          // torque envelope; commands clip (and flag) beyond
  double max_momentum_n_m_s = 3;      // momentum storage; SATURATED at the rail
  double rotor_inertia_kg_m2 = 4;     // speed = momentum / inertia
}

// Magnetorquer rod: specified by DIPOLE MOMENT, deliberately NOT torque.
// Torque is m x B, computed by the plant from the local field, so the
// available torque varies continuously around the orbit and is always
// zero about the field line. A max_torque field here would grant
// authority the device does not have and make magnetic detumble look
// better than reality (docs/ARCHITECTURE.md, "A magnetorquer has no
// maximum torque").
message MagnetorquerDevice {
  string name = 1;                    // instance name (becomes the message source)
  double max_dipole_a_m2 = 2;         // dipole envelope; commands clip (and flag) beyond
}

// Magnetometer: noise and range character. Read by BOTH the flight-side
// driver (to know the device) and the simulation's sensor model (to
// corrupt the truth field the way the device would).
message MagnetometerDevice {
  string name = 1;                    // instance name (becomes the message source)
  double rate_hz = 2;                 // native output data rate
  double noise_t = 3;                 // white-noise sigma per axis, tesla
  double full_scale_t = 4;            // measurement limit; beyond it the device rails
  double lsb_t = 5;                   // quantization step of the output
}
