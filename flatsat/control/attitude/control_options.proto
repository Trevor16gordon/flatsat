// Per-implementation options for the control composition — strategies,
// guidance sources, and estimators. Selected via oneofs in
// vehicle.proto's ControlConfig; each oneof field name IS the registry
// key.
//
// `optional` marks fields whose absence must be detected: gains have no
// sensible zero, so a missing gain fails loudly at startup instead of
// silently flying with 0.

syntax = "proto3";

package flatsat.v1;

// rate_damping: PD on body-rate error — the detumble law.
message RateDampingOptions {
  optional double kp = 1;              // required; N·m / (rad/s)
  optional double kd = 2;              // required; N·m / (rad/s²)
  optional double max_torque_n_m = 3;  // actuator envelope; absent = 1.0
}

// pid: PD plus integral action with anti-windup.
message PidOptions {
  optional double kp = 1;              // required
  optional double ki = 2;              // required
  optional double kd = 3;              // required
  optional double integral_limit = 4;  // per-axis clamp; absent = 1.0
  optional double max_torque_n_m = 5;  // actuator envelope; absent = 1.0
}

// bdot: magnetic detumble — dipole m = -k·dB/dt from the magnetometer
// alone; no rate gyro, no attitude knowledge. Underactuated by physics:
// there is never torque about the field line, and convergence relies on
// the field ROTATING along the orbit, so the along-B rate component
// decays only at orbital tempo.
message BdotOptions {
  optional double gain = 1;             // required; A·m² per (T/s)
  optional double max_dipole_a_m2 = 2;  // command envelope; absent = 1.0
  optional double filter_tau_s = 3;     // dB/dt low-pass time constant; absent = 0.5
}

// momentum_dump: the combined wheels + torquers system. Wheels fly the
// attitude (PD on rate error, identical to rate_damping); magnetorquers
// bleed the momentum the wheels have absorbed: m = dump_gain·(h x B)/|B|²
// produces external torque -k·h_perp, the attitude loop counters it, and
// the wheels hand their momentum to the field. The component of h along
// B waits for the orbit to rotate the field — the same underactuation
// floor B-dot has, now applied to stored momentum instead of body rate.
message MomentumDumpOptions {
  optional double kp = 1;               // required; N·m / (rad/s)
  optional double kd = 2;               // required; N·m / (rad/s²)
  optional double max_torque_n_m = 3;   // wheel envelope; absent = 1.0
  optional double dump_gain = 4;        // required; dipole per unit (h x B)/|B|²
  optional double max_dipole_a_m2 = 5;  // rod envelope; absent = 1.0
}

// constant_rate: fixed body-rate target; all zeros (or empty) = detumble.
message ConstantRateOptions {
  repeated double target_rates_rad_s = 1;  // 3 values, or empty for detumble
}

// passthrough: the measurement IS the estimate — nothing to configure.
message PassthroughOptions {}

// triad: deterministic two-vector attitude (TRIAD) from the magnetometer
// and sun sensor, against the ONBOARD models in flatsat/sim/orbit.py —
// the same pure-python models the plants fly, which is what makes the
// estimate testable everywhere. Attitude is invalid in eclipse (one
// vector is not an attitude); rates still pass through from the gyro.
message TriadOptions {
  string orbit = 1;  // saved orbit file the onboard models propagate (required)
}

// sun_point: the flagship pointing law. Wheels align a body axis with
// the MEASURED sun vector (alignment + rate damping); magnetorquers keep
// dumping wheel momentum, exactly the momentum_dump law. In eclipse the
// alignment term pauses — rate damping and the dump carry through.
message SunPointOptions {
  repeated double point_axis = 1;       // body axis to aim at the sun; 3 values (required)
  optional double k_align = 2;          // alignment gain [N·m per rad-ish]; required
  optional double kp = 3;               // required; rate damping N·m / (rad/s)
  optional double kd = 4;               // required; N·m / (rad/s²)
  optional double max_torque_n_m = 5;   // wheel envelope; absent = 1.0
  optional double dump_gain = 6;        // required; dipole per unit (h x B)/|B|²
  optional double max_dipole_a_m2 = 7;  // rod envelope; absent = 1.0
}
