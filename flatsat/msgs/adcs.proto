// ADCS actuator command messages (Track A: A1 mock loop onward).
//
// Commands reuse the common Header: sample_time_ns = when the control law
// ran, seq = per-source command counter, validity = acquisition facts about
// the INPUTS the command was computed from (a command computed from stale
// sensor data says so, rather than pretending).

syntax = "proto3";

package flatsat.v1;

import "flatsat/msgs/hal.proto";

// Reaction-wheel torque command, body frame, SI units.
message WheelTorqueCommand {
  Header header = 1;
  double torque_x_n_m = 2;
  double torque_y_n_m = 3;
  double torque_z_n_m = 4;
}

// Magnetorquer dipole command, body frame, A·m². Deliberately NOT a
// torque: the achievable torque is m x B and is decided by the plant's
// local field, never by the control law's request.
//
// Field numbers 5-7 on purpose, disjoint from WheelTorqueCommand's 2-4:
// a mis-wired topic then decodes as zeros (an absent field) instead of
// a 25 A·m² dipole masquerading as a 25 N·m torque. The vehicle loader
// also cross-checks the wiring, but the wire format should not be one
// copy-paste away from a plausible lie.
message DipoleCommand {
  Header header = 1;
  double dipole_x_a_m2 = 5;
  double dipole_y_a_m2 = 6;
  double dipole_z_a_m2 = 7;
}
