// HAL daemon message contract (PLAN.md §4) — the seam everything stands on.
//
// Every sensor message embeds Header. The header carries the four fields the
// architecture depends on: when the quantity was sampled, when it was
// published, a per-source monotonic sequence number, and a validity word.
// Daemons FLAG AND FORWARD — they never silently repair data; FDIR cannot
// detect what the HAL papers over.
//
// These .proto files are the single source of truth for inter-service
// interfaces. Regenerate language bindings with tools/gen-protos.sh.

syntax = "proto3";

package flatsat.v1;

// Fault flags OR-ed into Header.validity. Zero means "no flags: valid".
//
// Scope: these are ACQUISITION facts — things only the publishing daemon
// can observe at the driver boundary ("is this number a real, fresh,
// uncorrupted measurement?"). Whether a real measurement is operationally
// NORMAL (thermal limits, rate-of-change, cross-channel consistency) is
// explicitly NOT the daemon's judgment — that is the FDIR limit checker
// (PLAN §8 L1), configured by ground-tunable rules, not baked into HALs.
enum ValidityFlag {
  VALIDITY_FLAG_VALID = 0;      // no fault flags set
  VALIDITY_FLAG_RANGE = 1;      // beyond the device's DATASHEET measurement
                                // range — "the sensor cannot have measured
                                // this"; not an operational limit
  VALIDITY_FLAG_COMM = 2;       // bus/communication error during read
  VALIDITY_FLAG_CRC = 4;        // checksum failure on the raw read
  VALIDITY_FLAG_STALE = 8;      // no fresh sample within the freshness deadline
  VALIDITY_FLAG_SATURATED = 16; // pinned at the ADC/sensor rail — value is a
                                // clipped lower bound, not a measurement
}

// Common envelope embedded by every sensor/telemetry message.
message Header {
  string source = 1;           // publishing daemon instance, e.g. "imu0"
  fixed64 sample_time_ns = 2;  // flight-clock time the quantity was sampled
  fixed64 publish_time_ns = 3; // flight-clock time the message was published
  uint64 seq = 4;              // per-source monotonic sequence number
  uint32 validity = 5;         // bitwise OR of ValidityFlag; 0 == valid
}

// Header-only view of ANY bus message. Every message embeds Header as
// field 1, so parsing an unknown payload as HeaderEnvelope yields just
// the envelope (unknown fields are skipped) — the generic watchpoint
// FDIR's limit rules read validity flags through.
message HeaderEnvelope {
  Header header = 1;
}

// Inertial measurement sample. Body frame, SI units.
message ImuSample {
  Header header = 1;
  double gyro_x_rad_s = 2;
  double gyro_y_rad_s = 3;
  double gyro_z_rad_s = 4;
  double accel_x_m_s2 = 5;
  double accel_y_m_s2 = 6;
  double accel_z_m_s2 = 7;
  double temperature_c = 8;
}

// Single-point temperature sample (e.g. a Jetson thermal zone).
message TemperatureSample {
  Header header = 1;
  double temperature_c = 2;
  string location = 3; // physical/logical measurement point, e.g. "tj-thermal"
}

// Reaction-wheel state. A wheel has REAL state — speed, stored momentum,
// applied torque — published on cadence by the actuator daemon so FDIR,
// the recorder, and momentum management see the device truth, not the
// command that was sent to it.
message WheelState {
  Header header = 1;
  double speed_rad_s = 2;      // rotor speed about the spin axis
  // Stored ROTOR angular momentum about the spin axis — the REACTION to
  // what the wheel applies: +torque_n_m to the body DECREASES this.
  // Sign is load-bearing: the momentum-dump law and mission criteria
  // consume it, and the inverted convention once turned the dump into
  // positive feedback (wheels spun up exponentially).
  double momentum_n_m_s = 3;
  double torque_n_m = 4;       // torque actually being applied TO THE BODY about the spin axis
  bool saturated = 5;          // momentum at the envelope — torque authority degraded
}

// Magnetometer sample. Body frame, tesla — measured where m x B is
// evaluated, which is why the truth field is published body-frame too.
message MagnetometerSample {
  Header header = 1;
  double mag_x_t = 2;
  double mag_y_t = 3;
  double mag_z_t = 4;
}

// Coarse sun sensor sample. Body frame unit vector; sun_visible false
// (with zeroed vector) is the honest eclipse reading, not a fault.
// Field numbers 6-8 for the vector, disjoint from ImuSample's 2-4, so a
// mis-routed decode yields absence rather than plausible gyro rates.
message SunSensorSample {
  Header header = 1;
  bool sun_visible = 5;
  double sun_x = 6;
  double sun_y = 7;
  double sun_z = 8;
}

// Magnetorquer rod state: the dipole actually being driven along the
// rod's own axis (post-envelope). No speed, no momentum — a rod stores
// nothing; its authority lives entirely in the local field.
// One star tracker attitude solution. Real star trackers are smart
// devices: photons in, ATTITUDE out — so this sample carries the MRP,
// not an image. Field numbers 9-12 are disjoint from every other hal
// sample (see the MagnetometerSample lesson above).
message StarTrackerSample {
  Header header = 1;
  double sigma_x = 9;    // measured attitude, MRP (sigma_BN)
  double sigma_y = 10;
  double sigma_z = 11;
  // False while BLINDED (sun/Earth inside the exclusion cone): pointing
  // near a bright body is a real condition the estimator must ride out,
  // not a device fault — the STALE flag stays reserved for silence.
  bool star_valid = 12;
}

message MagnetorquerState {
  Header header = 1;
  double dipole_a_m2 = 2;
}
