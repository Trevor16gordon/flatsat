// COMMS COMPOSITION SCHEMA — the comms block of a vehicle file.
//
// Every layer is selected by a oneof whose FIELD NAME is the registry
// key, so the PHY and the framing swap independently and by config
// alone: a Pluto GMSK modem, a lossy in-process loopback for campaigns
// and CI, and (later) a learned receiver are peer implementations under
// identical framing — which is what makes the learned-vs-classical
// comparison honest.

syntax = "proto3";

package flatsat.v1;

// ---------------------------------------------------------------- PHY --

// In-process loopback: no hardware, no RF. Transmitted frames land in
// the paired receiver, optionally corrupted — the honest test PHY and
// the BER-campaign rig that needs no radio.
message LoopbackModemOptions {
  string channel = 1;             // paired endpoints share a channel name
  optional double frame_loss = 2; // fraction of frames dropped; absent = 0
  optional double bit_error_rate = 3;  // per-bit flip probability; absent = 0
  optional uint32 seed = 4;       // corruption RNG seed; absent = unseeded
}

// KISS over TCP: no DSP here at all. An external process owns the radio
// — a gr-satellites flowgraph, a GNU Radio design, Direwolf, a hardware
// TNC — and this carries frames to and from it over the framing that
// amateur and cubesat ground software has spoken for decades. Pair it
// with the ccsds framer to tunnel our own frames over any TNC, or with
// a pass-through framer to let the far side do the deframing with
// somebody else's standard implementation.
//
// This modem cannot radiate by itself, so the transmit gate lives in
// the process at the far end of the socket, not here.
message KissModemOptions {
  string host = 1;         // where the radio process listens; empty = 127.0.0.1
  uint32 port = 2;         // TCP port; 0 = 8001, the conventional KISS port
  uint32 kiss_port = 3;    // KISS port number inside the protocol, not TCP
}

// ADALM-Pluto over GNU Radio, GMSK — the proven baseline PHY (BER 0.00
// framed loopback, 2026-07-23). RF SAFETY: transmit is refused unless
// transmit_ack is explicitly true, mirroring the radio scripts'
// --transmit gate (FSW-RADIO-001); receive needs no acknowledgement.
message PlutoGmskModemOptions {
  string uri = 1;                   // e.g. "ip:192.168.2.1"
  double center_freq_hz = 2;
  double sample_rate_hz = 3;
  optional double offset_hz = 4;    // keep energy OFF DC (zero-IF lesson); absent = 250e3
  optional uint32 samples_per_symbol = 5;  // absent = 8
  optional int32 tx_attenuation_db = 6;    // absent = 60 (near-minimum power)
  bool transmit_ack = 7;            // MUST be true to enable TX. Cabled + 30 dB pads only.
  // Two-radio desks: the GROUND endpoint's radio, when it is a
  // different device than the flight endpoint's (e.g. two Plutos on
  // one host after the identity fix). Absent = both endpoints use uri.
  optional string ground_uri = 8;
}

// -------------------------------------------------------------- framing --

// CCSDS-style: attached sync marker, length, payload, CRC-32. A
// corrupted frame is DROPPED and counted, never delivered — the link's
// flag-and-forward equivalent.
message CcsdsFramerOptions {
  optional uint32 max_payload_bytes = 1;  // sanity bound on the length field; absent = 4096
}

// ------------------------------------------------------------------ link --

// Simulated pass geometry: the radio is gated even though both radios
// sit on one desk. Telemetry accumulates between passes and dumps on
// contact (PLAN §6). Absent = always in contact.
message ContactScheduleConfig {
  double period_s = 1;    // pass repeat interval
  double duration_s = 2;  // contact length within each period
}

message CommsConfig {
  // Bus topics whose messages are queued for downlink. Explicit by
  // design — the link carries named traffic, never the whole bus.
  repeated string downlink_topics = 1;
  optional uint32 segment_bytes = 2;   // payload bytes per segment; absent = 512
  optional uint32 queue_limit = 3;     // stored messages between passes; absent = 10000
  ContactScheduleConfig contact = 4;   // absent = always in contact
  // Topics the GROUND side queues for uplink (commands, artifact
  // chunks). Directional on purpose: the link is asymmetric, and an
  // allowlist that differs by direction is what keeps a republished
  // arrival on one side from echoing straight back across the link.
  repeated string uplink_topics = 5;
  // Telemetry downlinked by SAMPLE, not by message: the flight side
  // keeps only the LATEST message on each of these topics and queues
  // it every period_s. A 100 Hz sensor stream does not belong on a
  // space link; its newest value once a second does.
  repeated SampledTopicConfig sampled_downlink = 6;

  oneof modem {
    LoopbackModemOptions loopback = 10;
    PlutoGmskModemOptions pluto_gmsk = 11;
    KissModemOptions kiss = 12;
  }
  oneof framer {
    CcsdsFramerOptions ccsds = 20;
  }
}

message SampledTopicConfig {
  string topic = 1;
  double period_s = 2;
}
